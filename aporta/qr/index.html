<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR · Aporta al mapa</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:#fff;color:#12382a;font-family:Inter,system-ui,sans-serif;text-align:center;padding:2vh 4vw}
h1{font-size:clamp(26px,5vw,56px);margin:0;line-height:1.1}
img{width:min(62vh,86vw);height:auto;image-rendering:pixelated}
p{margin:0;font-size:clamp(16px,2.6vw,30px)}
code{font-size:clamp(14px,2.2vw,26px);word-break:break-all}
</style>
</head>
<body>
<h1>Escanea y agrega algo al mapa</h1>
<img src="qr.svg" alt="Código QR que abre la página para aportar al mapa">
<p>Un árbol, una plaza, un evento, una organización…</p>
<code id="u"></code>
<script>document.getElementById("u").textContent = new URL("../", location.href).href.replace(/^https?:\/\//, "");</script>
</body>
</html>
